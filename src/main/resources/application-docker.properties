spring.config.import=optional:configserver:http://config-server:8888
eureka.client.serviceUrl.defaultZone=http://eureka:8761/eureka

# microservice1 - auth, patients
spring.cloud.gateway.routes[0].id=microservice1
spring.cloud.gateway.routes[0].uri=http://microservice1:8081
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**,/api/patients/**,/api/users/**,/api/admin/**
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=0

# microservice2 - medical records, patients, ml rejet
spring.cloud.gateway.routes[1].id=microservice2
spring.cloud.gateway.routes[1].uri=http://microservice2:8082
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/medical-records/**,/api/patients/**,/api/ml/**
spring.cloud.gateway.routes[1].filters[0]=StripPrefix=0

# transplant-service (Mongo/NestJS)
spring.cloud.gateway.routes[2].id=transplant-mongo
spring.cloud.gateway.routes[2].uri=http://transplant-service:3001
spring.cloud.gateway.routes[2].predicates[0]=Path=/transplant-mongo/**
spring.cloud.gateway.routes[2].filters[0]=StripPrefix=1

# vital-signs-service
spring.cloud.gateway.routes[3].id=vital-signs
spring.cloud.gateway.routes[3].uri=http://vital-signs-service:8086
spring.cloud.gateway.routes[3].predicates[0]=Path=/vital-signs/**
spring.cloud.gateway.routes[3].filters[0]=StripPrefix=1

# microservice4 - report scheduling
spring.cloud.gateway.routes[4].id=report-scheduling
spring.cloud.gateway.routes[4].uri=http://microservice4:8084
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/schedules,/api/schedules/**
spring.cloud.gateway.routes[4].filters[0]=StripPrefix=0

# hospitalisation-service
spring.cloud.gateway.routes[5].id=hospitalisation
spring.cloud.gateway.routes[5].uri=http://hospitalisation:8089
spring.cloud.gateway.routes[5].predicates[0]=Path=/hospitalisation,/hospitalisation/**
spring.cloud.gateway.routes[5].filters[0]=StripPrefix=0

# lab-results-service
spring.cloud.gateway.routes[6].id=lab-results
spring.cloud.gateway.routes[6].uri=http://lab-results-service:9003
spring.cloud.gateway.routes[6].predicates[0]=Path=/lab-results/**
spring.cloud.gateway.routes[6].filters[0]=StripPrefix=0

# medical-media-service
spring.cloud.gateway.routes[7].id=medical-media
spring.cloud.gateway.routes[7].uri=http://medical-media-service:8090
spring.cloud.gateway.routes[7].predicates[0]=Path=/medical-media/**
spring.cloud.gateway.routes[7].filters[0]=StripPrefix=0

# ml-rejet
spring.cloud.gateway.routes[8].id=ml-rejet
spring.cloud.gateway.routes[8].uri=http://ml-rejet:8001
spring.cloud.gateway.routes[8].predicates[0]=Path=/ml-rejet/**
spring.cloud.gateway.routes[8].filters[0]=StripPrefix=1
